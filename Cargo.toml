[workspace]
resolver = "2"
members = [
    "crates/mnemonist-core",
    "crates/mnemonist-napi",
    "crates/difffuzz",
    "bench/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mnemonist-core = { path = "crates/mnemonist-core" }
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
napi-build = "2"
libc = "0.2"
proptest = "1"
serde_json = "1"
