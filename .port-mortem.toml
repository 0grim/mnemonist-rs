version         = "0.40.4"
license         = "MIT"
source_language = "JavaScript"
target_language = "Rust"
loc_total       = 15386
modules_total   = 44
tests_total     = 525          # measured pre-kickoff, Node 24.18.1, clean clone

[port]
scope_manifest = "tests/scope.txt"
# 43 of the 44, not all 44. semi-dynamic-trie.js (251 LOC) is not ported: it is
# absent from upstream's own index.js, has no file in the published test suite,
# is reached only from upstream's internal benchmark/ directory, and its source
# still carries "TODO: rename => ternary search tree". Nothing in the original
# suite could have checked a port of it. Stated in README.md rather than rounded
# up to 44 here.
modules_ported = 43
# Upstream LOC of fully ported modules. utils/typed-arrays.js (187 LOC) is in
# static-disjoint-set's require-closure but only getPointerArray is reachable
# from it, so it is not counted here; it will be when test/_utils.js lands.
loc_in_scope   = 7920

[verify]
build           = "docker build -t port-mortem ."
test            = "docker run --rm port-mortem"
test_repo_wide  = "docker run --rm port-mortem ./tests/run.sh all"
core_standalone = "docker build -t pm-core --target core . && docker run --rm pm-core"
hashes          = "sha256sum -c tests/SHA256SUMS"

[results]
